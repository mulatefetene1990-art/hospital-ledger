<!-- 1. CSS circle formatting block -->
<style>
    .calendar-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        max-width: 350px;
        font-family: sans-serif;
    }
    .day-box {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /* 🔴 THE TARGET PERFECT CIRCLE HIGHLIGHT */
    .today-circle {
        background-color: #ef4444 !important; /* Bright structural Red fill color */
        color: #ffffff !important;           /* Clear white font value */
        border-radius: 50% !important;       /* Forces strict uniform circular shape */
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        box-shadow: 0px 4px 8px rgba(239, 68, 68, 0.4);
    }
</style>

<!-- 2. The active automated template grid loop -->
<div class="calendar-grid">
    {% for day in range(1, 31) %}
        <div class="day-box">
            <!-- 🛠️ CRITICAL FIX: explicit integer to integer condition matching -->
            {% if day | int == current_day_number | int %}
                <span class="today-circle">{{ day }}</span>
            {% else %}
                <span>{{ day }}</span>
            {% endif %}
        </div>
    {% endfor %}
</div>
